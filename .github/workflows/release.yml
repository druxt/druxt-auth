---
name: Release

# Publishes the package to npm.
#
# dev: a push to 0.x that changes a changeset publishes a snapshot under
# the `dev` dist-tag. `latest` never moves, nothing is committed and no git
# tag is made. Install it with `druxt-auth@dev`.
#
# release: while changesets are pending, keeps a "version packages" pull
# request open against 0.x. Merging it is the release decision: the push
# that follows finds a version npm does not have, publishes it to `latest`,
# and creates a tag and a GitHub Release.
#
# The trigger is scoped to the changeset files themselves, not every push: a
# changeset is how this repository marks a package-affecting change, so a
# merge that only touches docs, CI or the changesets tooling's own config
# never cuts a snapshot on its own. It still publishes every changeset
# pending at the time, including ones left over from earlier merges, since
# the step that counts them reads the whole directory, not just this push's
# diff.
#
# Building and publishing are separate jobs. The build job runs repository
# code, install scripts included, so it holds no publishing rights: it ends
# by packing a tarball. The publish job holds the OIDC permission and runs
# nothing from the repository: it downloads that tarball and hands it to npm.
#
# Publishing authenticates through npm trusted publishing (OIDC), so there is
# no token. It stays off until the repository variable NPM_PUBLISH is `true`,
# which is set once the package names this file as its trusted publisher on
# npmjs.com. Until then the packed tarball is the dry run.
on:
  push:
    branches: [0.x]
    paths:
      - '.changeset/*.md'
      - '!.changeset/README.md'
  pull_request:
    branches: [0.x, 'feature/**']
    paths:
      - .github/workflows/release.yml
      - .changeset/config.json
      - scripts/release/**
      - package.json
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a publish half way through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on pull requests too, as a rehearsal. No id-token here: a lifecycle
  # script in a pull request must not be able to reach npm.
  snapshot:
    if: github.repository == 'druxt/druxt-auth'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      count: ${{ steps.pending.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # corepack reads the packageManager field, so the manager the lockfile
      # was written by is the one that installs it.
      - run: corepack enable && corepack prepare --activate

      - run: yarn install --frozen-lockfile

      - name: Test the release scripts
        run: yarn release:check:test

      - name: Count pending changesets
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $count" >> "$GITHUB_STEP_SUMMARY"

      # A snapshot cannot be cut in pre mode. The checkout is thrown away, so
      # dropping the marker here changes nothing on the branch.
      - name: Version the snapshot
        if: steps.pending.outputs.count != '0'
        run: |
          rm -f .changeset/pre.json
          yarn changeset version --snapshot dev

      - name: Build
        if: steps.pending.outputs.count != '0'
        run: yarn build

      - name: Check the release set
        if: steps.pending.outputs.count != '0'
        run: yarn release:check

      - name: Pack the tarball
        if: steps.pending.outputs.count != '0'
        run: |
          node scripts/release/pack.mjs dev-packages
          {
            echo "| Package | Version |"
            echo "| --- | --- |"
            node -p "require('./dev-packages/manifest.json').map((p) => '| ' + p.name + ' | ' + p.version + ' |').join('\n')"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.pending.outputs.count != '0'
        with:
          name: dev-packages
          path: dev-packages
          retention-days: 7
          if-no-files-found: error

  # No checkout and no install: nothing from the repository runs with the
  # OIDC permission. Trusted publishing needs npm 11.5.1 or later, which needs
  # a newer Node than the one the package builds on.
  dev:
    needs: snapshot
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/0.x' &&
      vars.NPM_PUBLISH == 'true' &&
      needs.snapshot.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # An exact version, and no install scripts: this job can publish.
      - name: Update npm
        run: npm install --global --ignore-scripts npm@11.19.1

      - uses: actions/download-artifact@v4
        with:
          name: dev-packages
          path: dev-packages

      # The leading ./ matters: npm reads a bare "dir/file.tgz" as the GitHub
      # shorthand "user/repo" and tries to clone it.
      - name: Publish under the dev tag
        run: |
          for file in $(node -p "require('./dev-packages/manifest.json').map((p) => p.file).join(' ')"); do
            npm publish "./dev-packages/$file" --tag dev --access public
          done
          echo "Published under the dev tag." >> "$GITHUB_STEP_SUMMARY"

  # Opens or updates the version pull request, and packs the version npm does
  # not have yet. It runs repository code, so it holds no publishing rights.
  version:
    if: github.repository == 'druxt/druxt-auth' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      unpublished: ${{ steps.unpublished.outputs.list }}
    steps:
      # GitHub runs no checks on a pull request opened with the workflow's own
      # token, and 0.x requires them. An app token gets them run. Without
      # the app the pull request still opens, and its checks need a manual run.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        if: vars.RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # changesets/action v1 pushes the version branch over git, so the
          # checkout keeps a token. The app's when it is set, so the checks it
          # opens the pull request with get run.
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: corepack enable && corepack prepare --activate

      - run: yarn install --frozen-lockfile

      # No publish input: this step only opens or updates the pull request.
      # The title is the squash commit's subject, so it has to be conventional.
      # Pinned to the v1 line: it pairs with @changesets/cli v2, which is what
      # this package and its Node 16 toolchain run. v2 of the action needs the
      # v3 CLI.
      - uses: changesets/action@06245a4e0a36c064a573d4150030f5ec548e4fcc # v1.4.10
        id: changesets
        with:
          version: yarn run version
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}

      - name: List the versions npm does not have
        id: unpublished
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          list=$(node scripts/release/check.mjs --list-unpublished)
          echo "$list"
          {
            echo 'list<<EOF'
            echo "$list"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.unpublished.outputs.list != ''
        run: yarn build

      - name: Check the release set
        if: steps.unpublished.outputs.list != ''
        run: yarn release:check

      # The tarball and the release notes travel together, so the publishing
      # job needs nothing from the repository.
      - name: Pack the tarball and the release notes
        if: steps.unpublished.outputs.list != ''
        env:
          UNPUBLISHED: ${{ steps.unpublished.outputs.list }}
        run: |
          # shellcheck disable=SC2086
          node scripts/release/pack.mjs release-packages $UNPUBLISHED
          for tag in $UNPUBLISHED; do
            file=$(TAG="$tag" node -p "require('./release-packages/manifest.json').find((p) => p.name + '@' + p.version === process.env.TAG).file")
            node scripts/release/notes.mjs "$tag" > "release-packages/$file.md"
          done

      - uses: actions/upload-artifact@v4
        if: steps.unpublished.outputs.list != ''
        with:
          name: release-packages
          path: release-packages
          retention-days: 30
          if-no-files-found: error

  # No checkout and no install: nothing from the repository runs with the OIDC
  # permission. A rerun skips whatever an earlier attempt published.
  release:
    needs: version
    if: needs.version.outputs.unpublished != '' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # An exact version, and no install scripts: this job can publish.
      - name: Update npm
        run: npm install --global --ignore-scripts npm@11.19.1

      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-packages

      - name: Publish, tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node -p "require('./release-packages/manifest.json').map((p) => p.name + ' ' + p.version + ' ' + p.file).join('\n')" > entries.txt
          # npm publishes under name@version; the git tag and release are the
          # bare version, which is how this repository has tagged releases.
          while read -r name version file; do
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm."
            else
              npm publish "./release-packages/$file" --access public
            fi
            if ! gh release view "$version" > /dev/null 2>&1; then
              gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes-file "release-packages/$file.md"
            fi
            echo "- $version" >> "$GITHUB_STEP_SUMMARY"
          done < entries.txt
