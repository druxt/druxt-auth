name: CI

on:
  push:
    branches: [ main, develop ]

  # No branch filter: a pull request into any base runs CI. A stacked pull
  # request targets the branch below it rather than develop, and a filter here
  # would leave every one of them untested but green.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x, 16.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - run: yarn

    - run: yarn build

    - run: yarn lint

    - run: yarn test --reporters=jest-junit --runInBand

    - name: Codecov
      uses: codecov/codecov-action@v3.1.4
