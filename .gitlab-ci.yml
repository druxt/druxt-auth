---
# CI for druxt-auth, mirroring .github/workflows/ci.yml.
#
# GitHub Actions is where the package's own releases are cut; this pipeline is
# the same checks at merge-request time, where review happens on the mirror.
# Keep the two in step when either changes: nothing on the GitHub side lints
# this file, so lint:yaml here runs actionlint over the workflow in return.
#
# Secret scanning is gitleaks, not GitLab's Security/Secret-Detection template.
# That template is an Ultimate-tier feature: on a non-Ultimate instance the
# include produces no job at all, so the config reads as coverage while
# scanning nothing. Confirmed by job list on a sibling repository that carries
# the same include.

stages:
  - lint
  - test
  - secret-detection

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  tags: [docker]
  timeout: 15m
  before_script:
    - 'section_start() { local n="$1" t="${2:-$1}"; printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)" "$n" "$t"; }'
    - 'section_end() { printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)" "$1"; }'

# Shared node setup. `corepack prepare --activate` reads the packageManager
# field rather than pinning a manager here, so this block is the same in every
# repository whatever it installs with. The cache is keyed by the lockfile
# hash, so a dependency bump misses once and hits thereafter.
.node:
  image: node:16.20.1
  interruptible: true
  cache:
    key:
      files:
        - yarn.lock
      prefix: node-16.20.1
    paths:
      - .yarn-cache/
  before_script:
    - !reference [default, before_script]
    - corepack enable
    - corepack prepare --activate
    - yarn config set cache-folder .yarn-cache
    - yarn install --frozen-lockfile

#
# --- Lint ---
#

lint:js:
  extends: .node
  stage: lint
  script:
    - section_start "eslint" "Linting sources, tests and scripts"
    - yarn lint:js
    - section_end "eslint"

lint:md:
  extends: .node
  stage: lint
  script:
    - section_start "markdownlint" "Linting Markdown"
    - yarn lint:md
    - section_end "markdownlint"

lint:cspell:
  extends: .node
  stage: lint
  script:
    - section_start "cspell" "Spell checking"
    - yarn lint:cspell
    - section_end "cspell"

# This repository is public, and its README and example are what people copy.
# A host only the author can reach must never reach a tracked file.
lint:private:
  extends: .node
  stage: lint
  script:
    - section_start "private-refs" "Checking for private host references"
    - yarn lint:private
    - section_end "private-refs"

# yamllint covers this file; actionlint covers the workflow, which nothing on
# the GitHub side lints before a push.
lint:format:
  extends: .node
  stage: lint
  script:
    - section_start "prettier" "Checking formatting"
    - yarn lint:format
    - section_end "prettier"

lint:yaml:
  stage: lint
  image: python:3.12-slim
  interruptible: true
  variables:
    ACTIONLINT_VERSION: '1.7.12'
    ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  script:
    - section_start "yamllint" "Linting YAML"
    - pip install --quiet yamllint
    - yamllint .gitlab-ci.yml .github/workflows/
    - section_end "yamllint"
    - section_start "actionlint" "Linting GitHub workflows"
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null
    - curl -sSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
    - echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
    - tar -xzf actionlint.tar.gz actionlint
    - ./actionlint -color
    - section_end "actionlint"

# The MR's own commits, not the whole history: these repositories squash-merge,
# so a prose title becomes the commit subject and breaks the next push.
lint:commit:
  extends: .node
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  variables:
    # Full history on both sides. --depth deepened the target branch
    # only, so a merge request longer than the shallow window had its
    # earliest commits validated by nothing.
    GIT_DEPTH: 0
  script:
    - section_start "commitlint" "Validating commit messages"
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - yarn lint:commit --from "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --to HEAD
    - section_end "commitlint"

#
# --- Test ---
#

# PHP for the example's Drupal backend, with Node alongside, because the
# end-to-end run needs both up at once. 8.3 matches the example's own
# `config.platform.php`, so the lock resolves the same here as anywhere.
.php-node:
  image: php:8.3
  interruptible: true
  timeout: 30m
  cache:
    key:
      files:
        - example/drupal/composer.lock
      prefix: php-8.3-composer
    paths:
      - example/drupal/vendor/
  before_script:
    - !reference [default, before_script]
    - section_start "toolchain" "Installing PHP extensions, Composer and Node"
    # python3-setuptools: this image's Python has no distutils, and the
    # node-gyp bundled with Node 16's npm still imports it when vue-jest's
    # deasync builds.
    - apt-get update -yqq && apt-get install -yqq git unzip curl sqlite3 libsqlite3-dev libzip-dev libpng-dev libjpeg62-turbo-dev libfreetype6-dev libonig-dev libxml2-dev libsodium-dev python3 python3-setuptools build-essential > /dev/null
    - docker-php-ext-configure gd --with-freetype --with-jpeg > /dev/null
    # sodium is not optional: lcobucci/jwt signs every Simple OAuth token with it.
    - docker-php-ext-install -j"$(nproc)" pdo_sqlite gd zip sodium opcache > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer --version=2.8.6 > /dev/null
    - curl -fsSL https://deb.nodesource.com/setup_16.x | bash - > /dev/null 2>&1
    - apt-get install -yqq nodejs > /dev/null
    - corepack enable && corepack prepare --activate
    - node --version && php --version | head -1
    - section_end "toolchain"

test:unit:
  extends: .node
  stage: test
  needs: []
  script:
    - section_start "build" "Building the module"
    - yarn build
    - section_end "build"
    - section_start "jest" "Running unit tests"
    - yarn test --reporters=default --reporters=jest-junit --runInBand
    - section_end "jest"
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/All files\s*\|\s*([\d.]+)/'

#
# --- Secret detection ---
#

secret-detection:
  stage: secret-detection
  image: alpine:3.21
  interruptible: true
  # gitleaks reads git history, and needs nothing this pipeline builds.
  dependencies: []
  variables:
    # Full history. gitleaks scans commits, and the default shallow
    # clone would hide every secret committed before the window.
    GIT_DEPTH: 0
    GITLEAKS_VERSION: '8.30.1'
    GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  script:
    - section_start "gitleaks" "Scanning for committed secrets"
    - apk add --no-cache curl tar git > /dev/null
    - curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
    - echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
    - tar -xzf gitleaks.tar.gz gitleaks
    # Scoped to this branch. gitleaks defaults to every ref, and the runner
    # fetches all of them, so an unscoped scan reports commits from branches
    # this pipeline is not testing, including ones already rewritten away.
    - ./gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose --log-opts="HEAD"
    - section_end "gitleaks"
    # A scan that finds nothing looks identical to a scan that cannot find
    # anything. Plant three credentials in a directory outside the repository
    # and assert all three are reported, so a bad download, a config change or
    # a widened allowlist fails the job instead of passing it quietly.
    #
    # Each value is split across its own prefix, so no fragment in this file
    # triggers the rule it is meant to exercise: the repository scan above
    # runs over this file too, and a canary that flags itself would need an
    # ignore entry, which is the thing being guarded against.
    #
    # Fixed values, not generated ones. Measured against gitleaks 8.30.1: a
    # random AWS access-key id on a plain assignment line is reported about
    # one time in five, and the dedicated aws-access-token rule accounts for
    # well under half of even that. What usually fires is generic-api-key, which needs a
    # keyword beside the value and applies an entropy threshold to it.
    #
    # What makes pinning work is that detection is deterministic per value:
    # the same key gives the same verdict every run, so a value verified to
    # fire keeps firing. Generation moves that coin flip to generation time,
    # which is why a generated canary presents as flake rather than as a
    # steady failure. Each of these three was verified to fire.
    #
    # Invented, not copied from any vendor's documentation: gitleaks
    # allowlists documentation keys, and a canary built from one is inert in
    # exactly the way this check exists to catch.
    - section_start "canary" "Checking that the scanner still detects"
    - |
      canary="$(mktemp -d)"
      pat="gh""p_8fK2mQ7xR4tV9nB3jH6yW1sZ5cD8gL0aE4uY"
      stripe="sk""_live_51aBcD2eFgH3iJkL4mNoP5qR6sTuV7wXyZ8a"
      slack="xo""xb-263594753641-2529420432-J1n4h6a9pQrStUvWxYz1AbCd"
      printf 'a = "%s"\nb = "%s"\nc = "%s"\n' "$pat" "$stripe" "$slack" > "$canary/canary.txt"
      ./gitleaks detect --no-git --source "$canary" --config .gitleaks.toml \
        --no-banner --redact \
        --report-format json --report-path "$canary/report.json" || true
      found=$(grep -c '"RuleID"' "$canary/report.json" || true)
      rm -rf "$canary"
      if [ "$found" != "3" ]; then
        echo "The canary planted 3 credentials and gitleaks reported $found."
        echo "The scan above proves nothing while this is true."
        exit 1
      fi
      echo "Canary detected 3 of 3 planted credentials."
    - section_end "canary"

lint:knip:
  extends: .node
  stage: lint
  script:
    - section_start "knip" "Checking for unused and undeclared dependencies"
    - yarn lint:knip
    - section_end "knip"

# Production only. A shipped runtime dependency is what actually reaches a
# consumer; a devDependency advisory is worth knowing about and not worth
# blocking a merge request on.

# Production only. A shipped runtime dependency is what actually reaches a
# consumer; a devDependency advisory is worth knowing about and not worth
# blocking a merge request on.

lint:audit:
  extends: .node
  stage: lint
  # Reporting only, deliberately. Every current finding reaches this package
  # through @nuxtjs/auth-next, its single runtime dependency, pinned to a
  # pre-release that has had no upstream release since 2022. A blocking gate
  # here would be red on every pipeline and read as noise within a week.
  # Flipping it to blocking is a decision to take with the replacement of that
  # dependency, not before it.
  allow_failure: true
  script:
    - section_start "audit" "Auditing shipped dependencies"
    - yarn lint:audit
    - section_end "audit"

# yamllint covers this file; actionlint covers the GitHub workflow, which
# nothing on the GitHub side lints before a push.

# The work is the author's. No commit, merge request description or tracked
# file may credit an AI tool as author, co-author or generator. Full history,
# because the range is the merge request's own and its base has to be present.

lint:attribution:
  image: node:16.20.1
  stage: lint
  interruptible: true
  variables:
    GIT_DEPTH: 0
  script:
    - section_start "attribution" "Checking for AI attribution"
    - bash .gitlab/scripts/check-attribution.sh
    - section_end "attribution"

# Project voice over the markdown a change touches, its commit messages and the
# merge request description. The changesets README and the Drupal scaffold are third-party text.

# Project voice over the markdown a change touches, its commit messages and the
# merge request description. The changesets README and the Drupal scaffold are third-party text.

lint:prose:
  image: node:16.20.1
  stage: lint
  interruptible: true
  variables:
    GIT_DEPTH: 0
    PROSE_LINT_GLOB: "!{.changeset/**,example/drupal/**,CHANGELOG.md}"
  cache:
    key: vale-3.17.1
    paths:
      - .vale/
  script:
    - section_start "prose" "Linting prose with Vale"
    - bash .gitlab/scripts/install-vale.sh .vale/bin .vale/styles
    # A branch pipeline carries commit messages that are already merged, so a
    # finding there is one nobody can act on. The merge request is the gate.
    - if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then prose_args=""; else prose_args="--skip-commits"; fi
    - bash .gitlab/scripts/lint-prose.sh $prose_args
    - section_end "prose"

#
# --- Test ---
#

# The end-to-end run: a real Drupal, a real consumer, a real browser. It is
# the only check that exercises the module inside a Nuxt application rather
# than against its own code.
test:e2e:
  extends: .php-node
  stage: test
  needs: []
  variables:
    WEBSERVER_HOST: '127.0.0.1'
    WEBSERVER_PORT: '8888'
    DB_FILE: /tmp/druxt-auth-e2e.sqlite
    # The last check is guarded on this. Unset, it skips and the run still
    # says it passed, one check lighter.
    CLIENT_ID: d428854d-7d89-4756-816f-3ab1ddf7dd36
    PASSWORD_CLIENT_ID: 6f2a1c40-98e3-4a2b-9c71-5d0e8b4f3a19
  script:
    - section_start "module" "Building the module"
    - yarn install --frozen-lockfile
    - yarn build
    - section_end "module"
    - section_start "backend" "Provisioning and starting the example backend"
    - yarn example:assemble
    - yarn example:provision
    - yarn example:start
    # A backend that answers is the precondition; without this the browser
    # failures below would all read as module defects.
    - curl -fsS "http://$WEBSERVER_HOST:$WEBSERVER_PORT/jsonapi" | grep -q '"jsonapi"'
    - section_end "backend"
    - section_start "frontend" "Building and serving the example frontend"
    - yarn example:install
    - yarn example:build
    - yarn example:serve &
    - bash scripts/wait-for-server.sh http://localhost:3000 120
    - section_end "frontend"
    - section_start "e2e" "Signing in through a browser"
    # Not --with-deps: on arm64 Playwright falls back to an Ubuntu 20.04
    # package list naming ttf-unifont and ttf-ubuntu-font-family, neither of
    # which exists on this image's Debian.
    - apt-get install -yqq --no-install-recommends libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 fonts-liberation fonts-unifont > /dev/null
    - npx playwright install chromium
    - yarn test:e2e
    - section_end "e2e"
  after_script:
    - cd example/drupal && .devtools/stop || true
  artifacts:
    when: on_failure
    paths:
      - example/drupal/.devtools/*.log
    expire_in: 1 week
