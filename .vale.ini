# Project voice for everything written here: markdown, commit messages and
# merge request descriptions. .gitlab/scripts/lint-prose.sh feeds all three
# through this configuration.
#
# StylesPath is populated by .gitlab/scripts/install-vale.sh, pinned and
# verified by checksum, rather than by `vale sync`.
StylesPath = .vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = ai-tells
