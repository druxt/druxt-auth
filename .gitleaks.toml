# gitleaks configuration.
#
# The default rule set, plus one narrowly scoped allowlist. Nothing is added
# here to make a scan pass: an entry needs a reason that would survive review.

[extend]
useDefault = true

[[allowlists]]
description = """
example/.env and the end-to-end job name the client ids of the example's two
consumers, and the secret of the confidential one. A client id is not a
credential: RFC 6749 calls it public, and it travels in the browser's
authorize URL by design. The secret is a fixed placeholder for a consumer the
example provisions from scratch, with that literal value, on a Drupal that
exists nowhere else, so the example runs without configuration.

Scoped to the three literal values rather than to any file. A whole-file
exemption would let a real secret pasted into example/.env pass unreported,
and generic-api-key is the rule that usually fires, with no canary of its
own. Every other value in these files is still reported, including one
pasted onto these same lines.
"""
targetRules = ["generic-api-key"]
regexes = [
  '''d428854d-7d89-4756-816f-3ab1ddf7dd36''',
  '''6f2a1c40-98e3-4a2b-9c71-5d0e8b4f3a19''',
  '''druxt-password-secret''',
]
